name: Eye Spy Core2 Custom v0.1.3

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-core2:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out your Eye Spy fork
        uses: actions/checkout@v4

      - name: Set up Python on the GitHub runner
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply validated Core2 changes
        shell: bash
        run: |
          python3 - <<'PY'
          #!/usr/bin/env python3
          """Eye Spy Core2 custom v0.1.3 source patch. Changes only relevant sections.
          
          Runs on GitHub runner against the user's fork; fails closed before writing.
          Other detection engines and partition tables are untouched.
          """
          from pathlib import Path
          
          MAIN = Path('src/main.cpp')
          DISPLAY = Path('src/m5basic_display.h')
          MARKER = 'EYESPY_CORE2_013'
          
          
          def exactly_one(src, needle, repl, description):
              number = src.count(needle)
              if number != 1:
                  raise RuntimeError(f'{description}: expected exactly one anchor, found {number}; NO FILES WRITTEN')
              return src.replace(needle, repl, 1)
          
          
          def region(src, start, end, description):
              if src.count(start) != 1 or src.count(end) != 1:
                  raise RuntimeError(f'{description}: function boundary mismatch; NO FILES WRITTEN')
              a = src.index(start)
              b = src.index(end)
              if b <= a:
                  raise RuntimeError(f'{description}: function ordering changed; NO FILES WRITTEN')
              return a, b
          
          
          def transform_main(src):
              start, end = region(src, 'static void processWifiScan(int n) {',
                                  'static void startWifiPromisc() {', 'Wi-Fi scan scope')
              original = src[start:end]
              block = original
              # Arduino String::c_str() must not outlive the String temporary.
              block = exactly_one(
                  block,
                  '        const char* ssid  = WiFi.SSID(i).c_str();',
                  '        String ssidStorage = WiFi.SSID(i);  // ' + MARKER + ': owned string\n'
                  '        const char* ssid = ssidStorage.c_str();',
                  'Wi-Fi SSID pointer lifetime')
              block = exactly_one(
                  block,
                  '    unsigned long now = millis();',
                  '    unsigned long now = millis();\n'
                  '    int eyeSpyStrongNetworks = 0;  // ' + MARKER + ': diagnostics',
                  'Wi-Fi count definition')
              block = exactly_one(
                  block,
                  '        if (WiFi.RSSI(i) < RSSI_MIN) continue;',
                  '        if (WiFi.RSSI(i) < RSSI_MIN) continue;\n'
                  '        ++eyeSpyStrongNetworks;',
                  'Wi-Fi RSSI floor count')
              # IMPORTANT: modify only the end-of-scan printf in this function, not the
              # other matching print statement in the Wi-Fi timeout handler.
              old = '    Serial.printf("[eyespy] WiFi done  score=%d\\n", g_score);'
              new = (old + '\n'
                     '    Serial.printf("[eyespy-custom] WiFi networks=%d above_floor=%d\\n",\n'
                     '                  n, eyeSpyStrongNetworks);')
              block = exactly_one(block, old, new, 'Wi-Fi completed diagnostics')
              if block.count(MARKER) != 2:
                  raise RuntimeError('Wi-Fi patch count mismatch; NO FILES WRITTEN')
              return src[:start] + block + src[end:]
          
          
          def transform_display(src):
              start, end = region(src, 'static void mbe_header(const char* left, const char* right,',
                                  'static void mbe_btnBar(', 'Header function scope')
              original = src[start:end]
              battery = '''#if defined(USE_M5CORE2_AWS)
              // EYESPY_CORE2_013: Core2 power status, refreshed at most every 5s.
              // A plus sign means charging now; not necessarily external USB power.
              static uint32_t lastBatteryRead = 0;
              static int32_t batteryPercent = -1;
              static bool chargingNow = false;
              uint32_t ms = millis();
              if (lastBatteryRead == 0 || (uint32_t)(ms - lastBatteryRead) >= 5000U) {
                  batteryPercent = M5.Power.getBatteryLevel();
                  chargingNow = (M5.Power.isCharging() == m5::Power_Class::is_charging);
                  lastBatteryRead = ms ? ms : 1;
              }
              char displayRight[40];
              if (batteryPercent >= 0 && batteryPercent <= 100) {
                  snprintf(displayRight, sizeof(displayRight), "%s  %ld%%%s",
                           right ? right : "", (long)batteryPercent, chargingNow ? "+" : "");
              } else {
                  snprintf(displayRight, sizeof(displayRight), "%s  BAT:--",
                           right ? right : "");
              }
              right = displayRight;
          #endif
          '''
              header = exactly_one(original, '    if (right && right[0]) {',
                                   battery + '    if (right && right[0]) {',
                                   'Core2 header power status')
              src = src[:start] + header + src[end:]
          
              # The stale-only UI tick is lightweight. Once per 5s refresh just the
              # title bar, not the whole screen. Only when no critical alert hold is active.
              start, end = region(src, 'static void m5basicUpdate(', 'static int m5basicButtonTick()',
                                  'UI update scope')
              body = src[start:end]
              old = '        mbe_drawLogStrip();   // force=false: skips unless new lines arrived\n        return;'
              new = '''        mbe_drawLogStrip();   // force=false: skips unless new lines arrived
          #if defined(USE_M5CORE2_AWS)
                  // EYESPY_CORE2_013: refresh battery display without a full redraw.
                  static uint32_t lastHeaderRefresh = 0;
                  if (lastHeaderRefresh == 0 || (uint32_t)(nowMs - lastHeaderRefresh) >= 5000U) {
                      char title[32];
                      snprintf(title, sizeof(title), "EYE SPY  SCORE:%d", score);
                      mbe_header(title, mbe_levelLabel(lvl), mbe_levelBg(lvl), MBE_WHITE);
                      lastHeaderRefresh = nowMs ? nowMs : 1;
                  }
          #endif
                  return;'''
              body = exactly_one(body, old, new, 'Periodic header redraw')
              src = src[:start] + body + src[end:]
              return src
          
          
          def transform(main, display):
              if MARKER in main or MARKER in display:
                  raise RuntimeError('Already patched; NO FILES WRITTEN')
              nm = transform_main(main)
              nd = transform_display(display)
              assert nm != main and nd != display
              assert nm.count(MARKER) == 2, 'Missing main modifications'
              assert nd.count(MARKER) == 2, 'Missing display modifications'
              # The original scanners remain present; no new partition changes.
              assert 'OpenDroneID' in nm and 'Flock' in nm
              return nm, nd
          
          
          def main():
              oldmain = MAIN.read_text(encoding='utf-8')
              olddisplay = DISPLAY.read_text(encoding='utf-8')
              newmain, newdisplay = transform(oldmain, olddisplay)
              # Only write after all validations succeeded.
              MAIN.write_text(newmain, encoding='utf-8')
              DISPLAY.write_text(newdisplay, encoding='utf-8')
              print('Eye Spy Core2 v0.1.3 patch applied to main and display source.')
              print('Existing drone/Flock/tracker engines preserved. No partition changes.')
          
          
          if __name__ == '__main__':
              main()
          PY

      - name: Inspect resulting source diff
        shell: bash
        run: |
          git diff --check
          git diff --stat
          grep -F 'String ssidStorage = WiFi.SSID(i);' src/main.cpp
          grep -F 'WiFi networks=%d above_floor=%d' src/main.cpp
          grep -F 'M5.Power.getBatteryLevel()' src/m5basic_display.h
          grep -F 'M5.Power.isCharging()' src/m5basic_display.h

      - name: Install PlatformIO on GitHub runner only
        run: python3 -m pip install --disable-pip-version-check platformio==6.1.18

      - name: Run upstream native tests
        run: pio test -e native

      - name: Compile Core2 For AWS BLE firmware
        run: pio run -e m5stack-core2-aws-ble

      - name: Package firmware and checksum
        shell: bash
        run: |
          mkdir -p dist
          cp .pio/build/m5stack-core2-aws-ble/firmware.bin dist/firmware.bin
          cd dist
          sha256sum firmware.bin > SHA256SUMS.txt
          ls -lh firmware.bin SHA256SUMS.txt

      - name: Make firmware available for download
        uses: actions/upload-artifact@v4
        with:
          name: eye-spy-core2-custom-v0-1-3
          path: dist/
          if-no-files-found: error
          retention-days: 30
